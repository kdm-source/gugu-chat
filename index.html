<script>
    const API_TOKEN = "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";
    // 💡 사장님 토큰 권한(Inference)이 살아있다면 이 모델이 가장 대답을 잘합니다.
    const MODEL_ID = "facebook/blenderbot-400M-distill"; 

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, 'user');
        input.value = '';

        const loading = addMessage("구구가 깃허브 망을 타고 뇌를 돌리는 중...", 'ai');

        try {
            // 💡 깃허브 페이지 주소(https)에서는 이 호출이 보안 에러 없이 통과됩니다.
            const response = await fetch(`https://api-inference.huggingface.co/models/${MODEL_ID}`, {
                headers: { 
                    "Authorization": `Bearer ${API_TOKEN}`,
                    "Content-Type": "application/json" 
                },
                method: "POST",
                body: JSON.stringify({ 
                    inputs: text, 
                    options: { wait_for_model: true } 
                }),
            });

            const result = await response.json();
            loading.remove();

            if (result.error) {
                addMessage("구구! 모델이 아직 자고 있다구구! 10초만 있다가 다시!", 'ai', 13);
                return;
            }

            // 진짜 AI 대답 출력
            let aiReply = Array.isArray(result) ? result[0].generated_text : result.generated_text;
            addMessage(aiReply + " 구구!", 'ai', Math.floor(Math.random() * 24) + 1);

        } catch (error) {
            loading.remove();
            // 💡 에러 대사도 킹받게 바꿨습니다.
            addMessage("구구! 깃허브 보안은 뚫었는데 허깅페이스가 옥수수 달란다구구!", 'ai', 19);
        }
    }
    window.onload = () => addMessage("구구! 깃허브 이사 완료! 이제 진짜 대화하자구구!", 'ai', 1);
</script>
